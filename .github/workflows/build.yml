name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Rename
        run: |
          V=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "ReceiptRadar-$V.apk"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ReceiptRadar-apk
          path: ReceiptRadar-*.apk
      - name: Publish as GitHub release (direct APK download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "ReceiptRadar-${VERSION}.apk" --title "Receipt Radar ${VERSION} (build ${GITHUB_RUN_NUMBER})" --notes "Install the APK on your phone. Updates install over the previous version and keep your data." --latest
